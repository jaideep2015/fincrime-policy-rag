# Single source of truth for pipeline tunables. Validated by src/fincrime_rag/config.py.

paths:
  manifest: data/manifest.csv
  raw_dir: data/raw
  extracted_dir: data/extracted
  processed_dir: data/processed
  eval_set: data/eval/qa_set.jsonl
  index_dir: chroma_db
  cache_dir: .cache
  experiments_dir: experiments/results

chunking:
  strategy: recursive        # recursive | (stretch) section_aware
  chunk_size: 512            # tokens
  chunk_overlap: 64          # tokens

embedding:
  provider: local
  model: BAAI/bge-small-en-v1.5
  batch_size: 32

vectorstore:
  backend: chroma
  collection: fincrime_policy

retrieval:
  mode: dense                # dense | bm25 | hybrid
  top_k: 5
  hybrid_rrf_k: 60

llm:
  provider: ollama           # ollama (default) | anthropic (optional, needs your own key)
  model: null                # chosen in Phase 5
  temperature: 0.0
  ollama_host: http://localhost:11434

seed: 42
