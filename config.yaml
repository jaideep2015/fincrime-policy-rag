# Single source of truth for pipeline tunables. Validated by src/fincrime_rag/config.py.

paths:
  manifest: data/manifest.csv
  raw_dir: data/raw
  extracted_dir: data/extracted
  processed_dir: data/processed
  eval_set: data/eval/qa_set.jsonl
  index_dir: chroma_db
  cache_dir: .cache
  experiments_dir: experiments/results
  reports_dir: reports

ingestion:
  # Scripted downloads are restricted to these hosts (US-government publishers that allow it).
  # FATF and FFIEC block scripted access: those files are placed manually (see manifest `source`).
  allowed_download_hosts:
    - www.fincen.gov
    - www.govinfo.gov
  min_pdf_bytes: 10000
  timeout_seconds: 60
  user_agent: "fincrime-rag-portfolio/0.1 (research; contact via repo)"

ocr:
  # Text-coverage check on every page, plus OCR fallback for pages whose text layer is incomplete
  # (e.g. FinCEN red-flag bullets that are images). OCR results are cached under paths.cache_dir.
  enabled: true
  engine: rapidocr                # rapidocr-onnxruntime, installed with pip (no system install)
  dpi: 200                        # render resolution for OCR
  # The coverage check OCRs every page with default settings (fast). Pages it flags are re-OCR'd with
  # looser detection settings, which find lines the default pass can miss, to produce the fallback text.
  recover_box_thresh: 0.3
  recover_text_score: 0.3
  recover_unclip_ratio: 2.0
  # 0.90 rather than 0.80: on the COVID advisory, page 5 (two missing red-flag bullets) scores 0.84 while
  # pages with complete text score 0.95-1.10 across the corpus.
  coverage_threshold: 0.90        # flag a page when text-layer words / OCR words is below this
  coverage_min_ocr_words: 10      # pages with fewer OCR words are not judged (decorative / blank)
  # Merge for flagged pages that still have a usable text layer: the text layer is the base and only OCR
  # boxes it does not already cover are added. Pages without a usable text layer use OCR text alone.
  merge_covered_fraction: 0.50    # an OCR box is "already covered" when this share of its area lies on text-layer words
  merge_min_layer_words: 100      # usable text layer: at least this many words ...
  merge_min_box_coverage: 0.35    # ... and at least this share of the OCR boxes covered by the text layer
  min_confidence: 0.60            # OCR boxes below this are dropped (the high-recall pass emits garbage at 0.3-0.5)
  icon_gutter_fraction: 0.09      # icon noise lives left of this share of the page width ...
  icon_max_chars: 3               # ... is at most this many characters ...
  icon_max_confidence: 0.85       # ... and is recognised with at most this confidence
  paragraph_gap_factor: 1.3       # line gap above this x the median line pitch starts a new paragraph

cleaning:
  header_footer_scan_lines: 5     # edge lines per side scanned for repeated running heads
  page_number_scan_lines: 3       # edge lines per side scanned for bare page numbers
  repeat_fraction: 0.4            # a normalised line on >= this share of pages is a header/footer
  min_pages_for_detection: 5      # shorter documents skip repeat detection
  strip_edge_page_numbers: true   # also drop bare page-number lines at page edges
  running_head_scan_lines: 3      # first lines of a page matched against the two pattern lists below
  running_head_patterns:          # whole-line regexes (e.g. CFR heads); a named group `section` fills section_hint
    - '^§\s*(?P<section>\d+\.\d+)$'
    - '^Pt\.\s*\d+,\s*(?:App\.\s*[A-Z]|Supp\.\s*I)$'
  printed_page_head_patterns:     # whole-line regexes for "N | TITLE" / "TITLE | N"; group `page` is the printed page
    - '^(?P<page>\d{1,4})\s*\|\s*\S.*$'
    - '^\S.*?\s*\|\s*(?P<page>\d{1,4})$'
  page_tags:                      # pages tagged with a content_type (every other page is "body")
    # Reg E Appendix A model forms: images of sample forms, poorly OCR'd, little retrieval value (D-016)
    - {doc_id: cfr_12_1005_reg_e, first_page: 61, last_page: 79, content_type: model_form}

indexing:
  exclude_content_types: [model_form]   # pages with these content types stay in data/processed but are not indexed

qa:
  empty_page_max_chars: 50        # pages at or below this are "empty"
  flag_empty_page_share: 0.05     # flag a document if more than this share of pages are empty ...
  flag_empty_page_min_count: 2    # ... and at least this many (a lone image cover page is normal)
  flag_bad_char_ratio: 0.01       # replacement/control/private-use characters
  flag_odd_token_ratio: 0.05      # vowel-less or very long non-URL tokens
  odd_token_ignore_acronyms: true # all-caps tokens (CMLN, NMLRA, TCOs) are acronyms, not garble
  flag_min_chars_per_page: 400    # median chars/page below this is suspicious

evalset:
  # Validator limits for data/eval/qa_set.jsonl (schema in DECISIONS.md D-018)
  max_questions_per_doc: 3        # warn when more questions than this have a document in their gold
  min_key_facts: 1
  max_key_facts: 4

chunking:
  strategy: recursive        # recursive | (stretch) section_aware
  chunk_size: 512            # tokens, counted with the embedding model's tokenizer (special tokens included)
  chunk_overlap: 64          # tokens
  special_tokens: 2          # [CLS] and [SEP]: the packing budget is chunk_size - special_tokens
  separators: ["\n\n", "\n", ". ", " "]   # recursive split order, coarse to fine
  min_chunk_tokens: 20       # a trailing chunk shorter than this is merged into its predecessor
  section_doc_prefixes: ["cfr_"]   # documents whose text is scanned for section headings
  section_heading_patterns:        # whole-line regexes; group `section` is the section number
    - '^§\s*(?P<section>\d{1,4}\.\d+)\s*$'
    - '^§\s*(?P<section>\d{1,4}\.\d+)\s+[A-Z][A-Za-z ,;’:\-]+\.?$'

embedding:
  provider: local
  model: BAAI/bge-small-en-v1.5
  batch_size: 32
  max_seq_length: 512
  normalize: true
  query_instruction: "Represent this sentence for searching relevant passages: "   # bge: queries only, not passages

vectorstore:
  backend: chroma
  collection: fincrime_policy
  space: cosine              # cosine | l2 | ip (embeddings are normalised)

retrieval:
  mode: hybrid               # dense | bm25 | hybrid (default picked from aggregate dev metrics, D-021)
  top_k: 5
  hybrid_rrf_k: 60
  candidate_pool: 50         # depth taken from each ranker before fusion
  bm25_k1: 1.5
  bm25_b: 0.75

evaluation:
  retrieval_ks: [1, 3, 5, 10]     # recall@k cut-offs; the largest is the retrieval depth
  splits: [dev]                   # splits scored; `test` is scored once at the end (Phase 6)

llm:
  provider: ollama           # ollama (default) | anthropic (optional, needs your own key)
  model: qwen2.5:3b-instruct
  temperature: 0.0
  ollama_host: http://localhost:11434
  num_ctx: 8192              # explicit Ollama context window (prompt + answer); logged with every result
  max_output_tokens: 400
  request_timeout_seconds: 300
  fallback_to_extractive: true   # if Ollama is unreachable, use the extractive backend and record it
  chars_per_token: 3.0       # conservative estimate used by the prompt-budget assertion

generation:
  context_k: 8               # chunks given to the generator; fixed a priori (D-022), never tuned on results
  extractive_sentences: 3    # sentences returned by the extractive backend
  min_sentence_words: 6      # shorter fragments are not quoted
  insufficient_marker: INSUFFICIENT_CONTEXT

refusal:
  # Retrieval-score gate (D-023): refuse when the top-1 dense cosine similarity is below the
  # `percentile`-th percentile of in-corpus top-1 similarities (sampled, a priori, not tuned).
  percentile: 5
  calibration_queries: 300   # corpus sentences sampled as queries (source chunk excluded from the ranking)
  min_query_words: 8
  calibration_file: data/processed/refusal_calibration.json   # derived artifact (gitignored)

injection:
  # Generic instruction-like phrasings (lower-case regexes), written a priori, not taken from any eval item.
  patterns:
    - '\b(ignore|disregard|forget)\b.{0,40}\b(previous|prior|above|earlier|all|any|your)\b.{0,40}\b(instructions?|rules?|prompts?|context)\b'
    - '\b(reveal|print|show|repeat)\b.{0,30}\b(system|hidden|initial)\b.{0,20}\b(prompt|instructions?)\b'
    - '\byou are now\b'
    - '\b(respond|reply|answer|output)\b.{0,20}\b(only|just|exactly)\b.{0,10}\b(with|in)\b'
    - '\bnew instructions?\b'
    - '\boverride\b.{0,30}\b(rules?|instructions?|safety|policy)\b'
  echo_overlap: 0.8          # a reply is an echo when this share of its words is inside an injected sentence

generation_eval:
  bootstrap_samples: 2000
  confidence: 0.95

experiments:
  # Phase 7 retrieval-only grid (D-032). Every configuration uses exact dense search so it is deterministic.
  work_dir: data/experiments        # chunks and embeddings per configuration (git-ignored)
  results_json: experiments/results/retrieval_grid.json   # aggregates only
  report: reports/retrieval_experiments.md
  baseline: {chunk_size: 512, chunk_overlap: 64}
  configs:
    - {chunk_size: 256, chunk_overlap: 32}
    - {chunk_size: 384, chunk_overlap: 48}
    - {chunk_size: 512, chunk_overlap: 64}
  modes: [dense, bm25, hybrid]
  ks: [1, 3, 5, 8, 10]
  hit_k: 5                          # doc-level hit rate cut-off

seed: 42
